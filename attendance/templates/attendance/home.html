<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Attendance Register</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            color: #17212b;
            display: grid;
            place-items: center;
        }

        main {
            width: min(720px, calc(100% - 64px));
            padding: 32px;
            background: #ffffff;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            box-shadow: 0 12px 32px rgba(23, 33, 43, 0.08);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        p {
            margin: 0 0 24px;
            color: #52616f;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 12px 18px;
            background: #fbffff;
            color: #ffffff;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
<main>
    <h1>Welcome to the Student Attendance Register</h1>
    <p>Click the button below to start taking attendance using face detection.</p>
    <a href="{% url 'attendance:take_attendance' %}">Take Attendance</a>

</body>
</html>
